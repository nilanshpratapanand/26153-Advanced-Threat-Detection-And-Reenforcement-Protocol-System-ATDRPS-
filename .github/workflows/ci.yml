name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # PyTorch is optional (its tests skip cleanly), and the wheel is large, so CI installs the
      # core dependencies only. Chromium-backed tests also skip when no browser is present.
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.24" "pandas>=2.0" "scipy>=1.10" "scikit-learn>=1.3" \
            "PyYAML>=6.0" "Flask>=3.0" "matplotlib>=3.7"
      - name: Run the test suite
        run: python tests/run_tests.py
