name: release

# Pushing a tag such as v0.2.0 publishes a GitHub release whose notes are that version's
# section of CHANGELOG.md. Nothing is built or uploaded beyond GitHub's own source archives.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract the release notes for this tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '/^## /{ if (found) exit; if ($2 == ver) { found = 1; next } } found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for version $version" >&2
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
