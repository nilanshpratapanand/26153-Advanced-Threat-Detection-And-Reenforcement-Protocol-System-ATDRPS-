[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atdrps"
version = "0.1.0"
description = "ATDRPS - Advanced Threat Detection and Reinforcement Protocol System: a world model for network attack forecasting (SIH 2026, PS 26153, NTRO)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Team Bell Labs, Lloyd Institute of Engineering & Technology" },
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "PyYAML>=6.0",
  "Flask>=3.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
torch = ["torch>=2.1"]

[project.scripts]
atdrps = "atdrps.cli:main"

[tool.setuptools.packages.find]
include = ["atdrps*"]
